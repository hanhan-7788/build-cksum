name: Build Static cksum
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build static cksum in Alpine
        run: |
          docker run --rm -v "$PWD":/work -w /work alpine:latest sh -c '
            apk add --no-cache build-base wget xz perl &&
            wget https://ftp.gnu.org/gnu/coreutils/coreutils-9.5.tar.xz &&
            tar -xf coreutils-9.5.tar.xz &&
            cd coreutils-9.5 &&
            ./configure FORCE_UNSAFE_CONFIGURE=1 LDFLAGS="-static" &&
            make -j$(nproc) &&
            cp src/cksum /work/fast_cksum &&
            /work/fast_cksum --version
          '

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: fast_cksum
          path: fast_cksum
